<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Firefox</title>
  <link rel="icon" href="./assets/firefox-icon.png" />
  <link rel="stylesheet" href="./terminal.css?v=7" />
</head>
<body>
  <section id="splash" class="sr">
    <div id="splash-shell" class="stage">
      <div id="stage-card" class="stage">
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch</button>
      <p id="jspi-note" hidden></p>
      <details class="advanced"><summary></summary>
        <input type="checkbox" id="opt-gpu" checked />
        <input type="checkbox" id="opt-jit" />
        <input type="text" id="opt-wisp" value="" />
      </details>
      <div id="console-output"></div>
    </div>
  </section>

  <!-- Polished mode splash (shown when ?mode=polished) -->
  <div id="polish" class="polish hide" aria-live="polite">
    <img class="polish-logo" src="./assets/firefox-icon.png" alt="Firefox" width="96" height="96" />
    <div class="polish-name">Firefox</div>
    <div id="polish-status" class="polish-status">Starting…</div>
    <div class="polish-bar"><div id="polish-fill"></div></div>
  </div>

  <canvas id="screen" width="1" height="1" tabindex="0"></canvas>

  <div id="term" class="term">
    <div id="term-out" class="term-out"></div>
    <div class="term-in-row">
      <span class="p">$</span>
      <input id="term-in" type="text" autocomplete="off" spellcheck="false" enterkeyhint="go" />
    </div>
  </div>

  <!-- Mobile soft-keyboard capture -->
  <textarea id="kb-capture" class="kb-capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text"></textarea>

  <div id="fabs" class="fabs">
    <button type="button" id="btn-term" class="fab" aria-label="Terminal">>_</button>
    <button type="button" id="btn-kb" class="fab" aria-label="Keyboard">⌨</button>
    <button type="button" id="btn-launch" class="fab fab-launch hide" aria-label="Launch">▶</button>
  </div>
  <input type="file" id="file-upload" multiple hidden />

  <script src="./coi-serviceworker.js?v=7"></script>
  <script src="./webdesk-fs.js?v=7"></script>
  <script src="./net/tailscale.js?v=7"></script>
  <script src="./cli.js?v=7"></script>
  <script type="module" src="./assets/index-D39giZCc.js?v=7"></script>
</body>
</html>
