<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firefox WASM — CLI</title>
  <link id="favicon" rel="icon" type="image/webp" href="logo.webp" />
  <!-- Upstream demo CSS (progress bits unused but harmless) -->
  <link rel="stylesheet" crossorigin href="./assets/index-CJZf4zMx.css" />
  <link rel="stylesheet" href="./terminal.css" />
</head>
<body>
  <!-- Upstream-required DOM (hidden). Do not remove — index-*.js binds these. -->
  <section id="splash" class="upstream-hidden" aria-hidden="true">
    <div id="splash-shell">
      <h1 id="project-title">Firefox WASM</h1>
      <div id="stage-card">
        <div id="progress-fill"></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status" class="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch Firefox</button>
      <p id="jspi-note" class="jspi-note" hidden></p>
      <details class="advanced">
        <summary>advanced</summary>
        <label><input type="checkbox" id="opt-gpu" checked /> GPU</label>
        <label><input type="checkbox" id="opt-jit" /> JIT</label>
        <label>Wisp <input type="text" id="opt-wisp" spellcheck="false" autocomplete="off" /></label>
      </details>
      <div id="console-output" class="console-box" role="log"></div>
    </div>
  </section>

  <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>

  <!-- CLI shell -->
  <div id="term" class="term" role="application" aria-label="Firefox WASM terminal">
    <div class="term-bar">
      <span class="term-title">firefox-wasm</span>
      <span id="term-ready" class="term-badge">loading assets…</span>
      <span class="term-hint">` to toggle · launch to start</span>
    </div>
    <div id="term-out" class="term-out" aria-live="polite"></div>
    <div class="term-in-row">
      <span class="term-prompt">$</span>
      <input id="term-in" class="term-in" type="text" autocomplete="off" spellcheck="false"
             placeholder="help · status · set · launch" />
    </div>
  </div>

  <script src="./coi-serviceworker.js"></script>
  <script src="./cli.js"></script>
  <script type="module" crossorigin src="./assets/index-D39giZCc.js"></script>
</body>
</html>
