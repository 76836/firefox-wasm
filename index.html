<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Firefox WASM</title>
  <link rel="icon" type="image/webp" href="logo.webp" />
  <link rel="stylesheet" href="./terminal.css?v=4" />
</head>
<body>
  <section id="splash" class="sr">
    <div id="splash-shell" class="stage">
      <div id="stage-card" class="stage">
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch</button>
      <p id="jspi-note" hidden></p>
      <details class="advanced"><summary></summary>
        <input type="checkbox" id="opt-gpu" checked />
        <input type="checkbox" id="opt-jit" />
        <input type="text" id="opt-wisp" value="" />
      </details>
      <div id="console-output"></div>
    </div>
  </section>

  <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>

  <div id="term" class="term">
    <div id="term-out" class="term-out"></div>
    <div class="term-in-row">
      <span class="p">$</span>
      <input id="term-in" type="text" autocomplete="off" spellcheck="false" enterkeyhint="go" />
    </div>
  </div>

  <button type="button" id="btn-term" class="fab" aria-label="Terminal">>_</button>
  <button type="button" id="btn-launch" class="fab fab-launch hide" aria-label="Launch">▶</button>
  <input type="file" id="file-upload" multiple />

  <script src="./coi-serviceworker.js?v=4"></script>
  <script src="./cli.js?v=4"></script>
  <script type="module" src="./assets/index-D39giZCc.js?v=4"></script>
</body>
</html>
