<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#38383d" />
  <title>Firefox</title>
  <link rel="icon" href="./assets/firefox-icon.png"  />
  <link rel="stylesheet" href="./app.css?v=15" />
</head>
<body>
  <section id="splash" class="sr" aria-hidden="true">
    <div id="splash-shell" class="stage">
      <div id="stage-card" class="stage">
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch</button>
      <p id="jspi-note" hidden></p>
      <details class="advanced">
        <summary></summary>
        <input type="checkbox" id="opt-gpu" checked />
        <input type="checkbox" id="opt-jit" />
        <input type="text" id="opt-wisp" value="" />
      </details>
      <div id="console-output"></div>
    </div>
  </section>

  <canvas id="screen" width="1" height="1" tabindex="0"></canvas>

  <!-- Polished: logo + bar only, solid grey -->
  <div id="polish" class="polish hide">
    <img class="polish-logo" src="./assets/firefox-icon.png" alt="" width="96" height="96" />
    <div class="polish-bar"><div id="polish-fill"></div></div>
  </div>

  <div id="term" class="term">
    <div id="term-out" class="term-out"></div>
    <div class="term-in-row">
      <span class="p">$</span>
      <input id="term-in" type="text" autocomplete="off" spellcheck="false" enterkeyhint="go" />
    </div>
  </div>

  <textarea id="kb-capture" class="kb-capture" autocomplete="off" spellcheck="false"></textarea>

  <div id="fabs" class="fabs">
    <button type="button" id="btn-term" class="fab" title="Terminal">>_</button>
    <button type="button" id="btn-kb" class="fab" title="Keyboard">⌨</button>
    <button type="button" id="btn-launch" class="fab fab-go hide" title="Launch">▶</button>
  </div>

  <script src="./coi-serviceworker.js?v=15"></script>
  <script src="./gecko-host.js?v=15"></script>
  <script src="./webdesk-fs.js?v=15"></script>
  <script src="./ui.js?v=15"></script>
  <script type="module" src="./assets/index-D39giZCc.js?v=15"></script>
</body>
</html>
